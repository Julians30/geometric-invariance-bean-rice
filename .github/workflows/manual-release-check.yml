name: Manual strict release check

on:
  workflow_dispatch:

jobs:
  strict-release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit release boundary
        run: python scripts/audit_release_scope.py

      - name: Audit release notebooks
        run: python scripts/audit_notebooks.py

      - name: Require all release-intended frozen CSV files and verify integrity
        run: python scripts/verify_integrity.py --strict
